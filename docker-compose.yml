services:
    backend:
        image: ghcr.io/git-stella/dv1677-ht26-grupp3-backend:latest
        ports:
          - "${PORT:-3000}:3000"
        env_file:
          - .env
        environment:
            PORT: 3000
            #MONGODB_URI: mongodb://root:secret@mongodb:27017/
            MONGODB_URI: ${MONGODB_URI:-mongodb://mongodb:27017}
            DATABASE_NAME: jsramverk
        depends_on:
            - mongodb
        #restart: unless-stopped
        restart: always

    mongodb:
        image: mongo:latest
        container_name: mongodb
        ports:
            - "27017:27017"
        environment:
            MONGO_INITDB_ROOT_USERNAME: root
            MONGO_INITDB_ROOT_PASSWORD: secret
        volumes:
            - mongodb_data:/data/db
        restart: always

volumes:
    mongodb_data:
